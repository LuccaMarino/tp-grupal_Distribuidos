  q4_joiner_0:
    build:
      context: ./src/
      dockerfile: q4_joiner/Dockerfile
    container_name: q4_joiner_0
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "q4_joiner_group"
      RESULTS_GROUP: "results_group"
      GATEWAY_AMOUNT: 1
      AGGREGATOR_AMOUNT: 2
      PYTHONUNBUFFERED: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  word_counter_0:
    build:
      context: ./src/
      dockerfile: word_counter/Dockerfile
    container_name: word_counter_0
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "word_counters_group"
      SUM_PARTIAL_LENGTH_GROUP: "sum_partial_length_group"
      Q5_JOINER_AMOUNT: 1
      # EXPECTED_EOFS = PARSER_AMOUNT (3) * WORD_SUM_AMOUNT (3)
      EXPECTED_EOFS: 9
      SUM_PARTIAL_LENGTH: 100
      PYTHONUNBUFFERED: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  word_counter_1:
    build:
      context: ./src/
      dockerfile: word_counter/Dockerfile
    container_name: word_counter_1
    environment:
      ID: "1"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "word_counters_group"
      SUM_PARTIAL_LENGTH_GROUP: "sum_partial_length_group"
      Q5_JOINER_AMOUNT: 1
      # EXPECTED_EOFS = PARSER_AMOUNT (3) * WORD_SUM_AMOUNT (3)
      SUM_PARTIAL_LENGTH: 100
      EXPECTED_EOFS: 9
      PYTHONUNBUFFERED: "1"
    depends_on:
