  q5_joiner_0:
    build:
      context: ./src/
      dockerfile: q5_joiner/Dockerfile
    container_name: q5_joiner_0
    volumes:
    - q5_joiner_new_articles:/new_articles
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      NEW_ARTICLES_GROUP: "q5_joiner_group"
      SUM_PARTIAL_LENGTH_GROUP: "sum_partial_length_group"
      RESULTS_GROUP: "results_group"
      EXPECTED_WORDSUM_EOFS: 9 # PARSER_AMOUNT (3) * WORD_SUM_AMOUNT (3)
      EXPECTED_WORDCOUNTER_EOFS: 3 # WORD_COUNTER_AMOUNT (3)
      GATEWAY_AMOUNT: 1
      STORAGE_PATH: "/new_articles"
      BATCH_SIZE: 100
      PYTHONUNBUFFERED: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  client_0:
    <<: *client-base
    container_name: client_0
    environment:
      <<: *client-env
      OUTPUT_FILE_Q1: "/output/client_0_output_q1.csv"
      OUTPUT_FILE_Q2: "/output/client_0_output_q2.csv"
      OUTPUT_FILE_Q3: "/output/client_0_output_q3.csv"
      OUTPUT_FILE_Q4: "/output/client_0_output_q4.csv"
      OUTPUT_FILE_Q5: "/output/client_0_output_q5.csv"
      INPUT_DIR: "/datasets/client_0"

  client_1:
