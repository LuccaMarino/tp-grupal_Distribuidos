      FLUSH_MESSAGES: 1000
    depends_on:
      rabbitmq:
        condition: service_healthy

  q4_aggregator_0:
    build:
      context: ./src/
      dockerfile: q4_aggregator/Dockerfile
    container_name: q4_aggregator_0
    volumes:
      - q4_aggregator_0_data:/data
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "q4_aggregators_group"
      JOINER_GROUP: "q4_joiner_group"
      PARSER_AMOUNT: 3
      WORD_SUM_AMOUNT: 3
      PYTHONUNBUFFERED: "1"
      STORAGE_PATH: "/data"
