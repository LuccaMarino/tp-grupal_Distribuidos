x-client-env: &client-env
  PYTHONUNBUFFERED: "1"
  SERVER_HOST: "gateway"
  SERVER_PORT: "5678"
  RETRY_COUNT: "5"
  DELAY_BETWEEN_RETRIES: "1"
  BATCH_SIZE: "100"

x-client-base: &client-base
  build:
    context: ./src/
    dockerfile: client/Dockerfile
  volumes:
    - ./datasets:/datasets
    - ./output:/output
  depends_on:
    - gateway

services:
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    environment:
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "results_group"
      OUTPUT_GROUP: "articles_group"
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: "gateway"
      SERVER_PORT: "5678"
      PARSER_AMOUNT: 3
      IMAGE_DOWNLOADER_AMOUNT: 1
      Q3_AGGREGATOR_AMOUNT: 2
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    build:
      context: ./src/
      dockerfile: rabbitmq/Dockerfile
    container_name: rabbitmq
    environment:
      RABBITMQ_LOG_LEVELS: "error"
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672

  parser_0:
    build:
      context: ./src/
      dockerfile: parser/Dockerfile
    container_name: parser_0
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "articles_group"
      OUTPUT_Q1: "results_group"
      OUTPUT_Q2: "images_group"
      OUTPUT_ABSTRACT: "abstracts_group"
      GATEWAY_AMOUNT: 1
      IMAGE_DOWNLOADER_AMOUNT: 1
      WORD_SUM_AMOUNT: 3
      PYTHONUNBUFFERED: "1"
    depends_on:
      gateway:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  parser_1:
    build:
      context: ./src/
      dockerfile: parser/Dockerfile
    container_name: parser_1
    environment:
      ID: "1"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "articles_group"
      OUTPUT_Q1: "results_group"
      OUTPUT_Q2: "images_group"
      OUTPUT_ABSTRACT: "abstracts_group"
      GATEWAY_AMOUNT: 1
      IMAGE_DOWNLOADER_AMOUNT: 1
      WORD_SUM_AMOUNT: 3
      PYTHONUNBUFFERED: "1"
    depends_on:
      gateway:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  parser_2:
    build:
      context: ./src/
      dockerfile: parser/Dockerfile
    container_name: parser_2
    environment:
      ID: "2"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "articles_group"
      OUTPUT_Q1: "results_group"
      OUTPUT_Q2: "images_group"
      OUTPUT_ABSTRACT: "abstracts_group"
      GATEWAY_AMOUNT: 1
      IMAGE_DOWNLOADER_AMOUNT: 1
      WORD_SUM_AMOUNT: 3
      PYTHONUNBUFFERED: "1"
    depends_on:
      gateway:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  image_downloader_0:
    build:
      context: ./src/
      dockerfile: image_downloader/Dockerfile
    container_name: image_downloader_0
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      GATEWAY_AMOUNT: 1
      INPUT_GROUP: "images_group"
      OUTPUT_GROUP: "results_group"
      MAX_RETRIES: 4
      RETRY_DELAY: 0.6
    depends_on:
      parser_0:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  word_sum_0:
    build:
      context: ./src/
      dockerfile: word_sum/Dockerfile
    container_name: word_sum_0
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "abstracts_group"
      Q3_AGGREGATOR_GROUP: "q3_aggregators_group"
      Q3_AGGREGATOR_AMOUNT: 2
      Q4_AGGREGATOR_GROUP: "q4_aggregators_group"
      Q4_AGGREGATOR_AMOUNT: 2
      WORD_COUNTER_GROUP: "word_counters_group"
      WORD_COUNTER_AMOUNT: 3
      Q5_JOINER_GROUP: "q5_joiner_group"
      PYTHONUNBUFFERED: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  word_sum_1:
    build:
      context: ./src/
      dockerfile: word_sum/Dockerfile
    container_name: word_sum_1
    environment:
