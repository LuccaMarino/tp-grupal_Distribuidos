x-client-env: &client-env
  PYTHONUNBUFFERED: "1"
  SERVER_HOST: "gateway"
  SERVER_PORT: "5678"
  RETRY_COUNT: "5"
  DELAY_BETWEEN_RETRIES: "1"

x-client-base: &client-base
  build:
    context: ./src/
    dockerfile: client/Dockerfile
  volumes:
    - ./datasets:/datasets
    - ./output:/output
  depends_on:
    - gateway

services:
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    environment:
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "results_group"
      OUTPUT_GROUP: "articles_group"
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: "gateway"
      SERVER_PORT: "5678"
      PARSER_AMOUNT: 3
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    build:
      context: ./src/
      dockerfile: rabbitmq/Dockerfile
    container_name: rabbitmq
    environment:
      RABBITMQ_LOG_LEVELS: "error"
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672

  parser_0:
    build:
      context: ./src/
      dockerfile: parser/Dockerfile
    container_name: parser_0
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "articles_group"
      OUTPUT_Q1: "results_group"
      OUTPUT_Q2: "images_group"
      OUTPUT_ABSTRACT: "abstracts_group"
      GATEWAY_AMMOUNT: 1
      IMAGE_DOWNLOADER_AMMOUNT: 1
      WORD_SUM_AMMOUNT: 1
      PYTHONUNBUFFERED: "1"
    depends_on:
      gateway:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  parser_1:
    build:
      context: ./src/
      dockerfile: parser/Dockerfile
    container_name: parser_1
    environment:
      ID: "1"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "articles_group"
      OUTPUT_Q1: "results_group"
      OUTPUT_Q2: "images_group"
      OUTPUT_ABSTRACT: "abstracts_group"
      GATEWAY_AMMOUNT: 1
      IMAGE_DOWNLOADER_AMMOUNT: 1
      WORD_SUM_AMMOUNT: 1
      PYTHONUNBUFFERED: "1"
    depends_on:
      gateway:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  parser_2:
    build:
      context: ./src/
      dockerfile: parser/Dockerfile
    container_name: parser_2
    environment:
      ID: "2"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "articles_group"
      OUTPUT_Q1: "results_group"
      OUTPUT_Q2: "images_group"
      OUTPUT_ABSTRACT: "abstracts_group"
      GATEWAY_AMMOUNT: 1
      IMAGE_DOWNLOADER_AMMOUNT: 1
      WORD_SUM_AMMOUNT: 1
      PYTHONUNBUFFERED: "1"
    depends_on:
      gateway:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  image_downloader_0:
    build:
      context: ./src/
      dockerfile: image_downloader/Dockerfile
    container_name: image_downloader_0
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      GATEWAY_AMMOUNT: 1
      INPUT_GROUP: "images_group"
      OUTPUT_GROUP: "results_group"
    depends_on:
      parser_0:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  word_sum_0:
    build:
      context: ./src/
      dockerfile: word_sum/Dockerfile
    container_name: word_sum_0
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "abstracts_group"
      AGGREGATOR_GROUP: "word_aggregators_group"
      AGGREGATOR_AMOUNT: 2
      WORD_COUNTER_GROUP: "word_counters_group"
      WORD_COUNTER_AMOUNT: 3
      Q5_JOINER_GROUP: "q5_joiner_group"
      PYTHONUNBUFFERED: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  word_counter_0:
    build:
      context: ./src/
      dockerfile: word_counter/Dockerfile
    container_name: word_counter_0
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "word_counters_group"
      SUM_PARTIAL_LENGTH_GROUP: "sum_partial_length_group"
      Q5_JOINER_AMOUNT: 1
      # EXPECTED_EOFS = PARSER_AMOUNT (3) * WORD_SUM_AMOUNT (1)
      EXPECTED_EOFS: 3
      PYTHONUNBUFFERED: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  word_counter_1:
    build:
      context: ./src/
      dockerfile: word_counter/Dockerfile
    container_name: word_counter_1
    environment:
      ID: "1"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "word_counters_group"
      SUM_PARTIAL_LENGTH_GROUP: "sum_partial_length_group"
      Q5_JOINER_AMOUNT: 1
      # EXPECTED_EOFS = PARSER_AMOUNT (3) * WORD_SUM_AMOUNT (1)
      EXPECTED_EOFS: 3
      PYTHONUNBUFFERED: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  word_counter_2:
    build:
      context: ./src/
      dockerfile: word_counter/Dockerfile
    container_name: word_counter_2
    environment:
      ID: "2"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "word_counters_group"
      SUM_PARTIAL_LENGTH_GROUP: "sum_partial_length_group"
      Q5_JOINER_AMOUNT: 1
      # EXPECTED_EOFS = PARSER_AMOUNT (3) * WORD_SUM_AMOUNT (1)
      EXPECTED_EOFS: 3
      PYTHONUNBUFFERED: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  q5_joiner_0:
    build:
      context: ./src/
      dockerfile: q5_joiner/Dockerfile
    container_name: q5_joiner_0
    volumes:
    - q5_joiner_new_articles:/new_articles
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      NEW_ARTICLES_GROUP: "q5_joiner_group"
      SUM_PARTIAL_LENGTH_GROUP: "sum_partial_length_group"
      RESULTS_GROUP: "results_group"
      EXPECTED_WORDSUM_EOFS: 3 # PARSER_AMOUNT (3) * WORD_SUM_AMOUNT (1)
      EXPECTED_WORDCOUNTER_EOFS: 3 # WORD_COUNTER_AMOUNT (3)
      GATEWAY_AMOUNT: 1
      STORAGE_PATH: "/new_articles"
      PYTHONUNBUFFERED: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  client_0:
    <<: *client-base
    container_name: client_0
    environment:
      <<: *client-env
      INPUT_FILE: "/datasets/client_1.parquet"
      OUTPUT_FILE: "/output/client_0_output.parquet"

