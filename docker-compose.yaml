x-client-env: &client-env
  PYTHONUNBUFFERED: "1"
  SERVER_HOST: "gateway"
  SERVER_PORT: "5678"
  RETRY_COUNT: "5"
  DELAY_BETWEEN_RETRIES: "1"

x-client-base: &client-base
  build:
    context: ./src/
    dockerfile: client/Dockerfile
  volumes:
    - ./datasets:/datasets
    - ./output:/output
  depends_on:
    - gateway

services:
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    environment:
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "results_group"
      OUTPUT_GROUP: "articles_group"
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: "gateway"
      SERVER_PORT: "5678"
      PARSER_AMOUNT: 3
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    build:
      context: ./src/
      dockerfile: rabbitmq/Dockerfile
    container_name: rabbitmq
    environment:
      RABBITMQ_LOG_LEVELS: "error"
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672

  parser_0:
    build:
      context: ./src/
      dockerfile: parser/Dockerfile
    container_name: parser_0
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "articles_group"
      OUTPUT_Q1: "results_group"
      OUTPUT_Q2: "images_group"
      OUTPUT_ABSTRACT: "abstracts_group"
      GATEWAY_AMMOUNT: 1
      IMAGE_DOWNLOADER_AMMOUNT: 1
      WORD_SUM_AMMOUNT: 1
      PYTHONUNBUFFERED: "1"
    depends_on:
      gateway:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  parser_1:
    build:
      context: ./src/
      dockerfile: parser/Dockerfile
    container_name: parser_1
    environment:
      ID: "1"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "articles_group"
      OUTPUT_Q1: "results_group"
      OUTPUT_Q2: "images_group"
      OUTPUT_ABSTRACT: "abstracts_group"
      GATEWAY_AMMOUNT: 1
      IMAGE_DOWNLOADER_AMMOUNT: 1
      WORD_SUM_AMMOUNT: 1
      PYTHONUNBUFFERED: "1"
    depends_on:
      gateway:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  parser_2:
    build:
      context: ./src/
      dockerfile: parser/Dockerfile
    container_name: parser_2
    environment:
      ID: "2"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "articles_group"
      OUTPUT_Q1: "results_group"
      OUTPUT_Q2: "images_group"
      OUTPUT_ABSTRACT: "abstracts_group"
      GATEWAY_AMMOUNT: 1
      IMAGE_DOWNLOADER_AMMOUNT: 1
      WORD_SUM_AMMOUNT: 1
      PYTHONUNBUFFERED: "1"
    depends_on:
      gateway:
        condition: service_started
      rabbitmq:
        condition: service_healthy

