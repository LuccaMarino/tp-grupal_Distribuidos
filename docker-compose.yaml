x-client-env: &client-env
  PYTHONUNBUFFERED: "1"
  SERVER_HOST: "gateway"
  SERVER_PORT: "5678"
  RETRY_COUNT: "5"
  DELAY_BETWEEN_RETRIES: "1"

x-client-base: &client-base
  build:
    context: ./src/
    dockerfile: client/Dockerfile
  volumes:
    - ./datasets:/datasets
    - ./output:/output
  depends_on:
    - gateway

services:
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    environment:
      MOM_HOST: "rabbitmq"
      INPUT_QUEUE: "results_queue"
      OUTPUT_QUEUE: "articles_queue"
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: "gateway"
      SERVER_PORT: "5678"

  rabbitmq:
    build:
      context: ./src/
      dockerfile: rabbitmq/Dockerfile
    container_name: rabbitmq
    environment:
      RABBITMQ_LOG_LEVELS: "error"
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672

  word_sum_0:
    build:
      context: ./src/
      dockerfile: word_sum/Dockerfile
    container_name: word_sum_0
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "abstracts_group"
      AGGREGATOR_GROUP: "word_aggregators_group"
      AGGREGATOR_AMOUNT: 2
      WORD_COUNTER_GROUP: "word_counters_group"
      WORD_COUNTER_AMOUNT: 1
      Q5_JOINER_GROUP: "q5_joiner_group"
      PYTHONUNBUFFERED: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  client_0:
    <<: *client-base
    container_name: client_0
    environment:
      <<: *client-env
      INPUT_FILE: "/datasets/client_0.parquet"
      OUTPUT_FILE: "/output/client_0_output.parquet"

