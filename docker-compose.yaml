      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "abstracts_group"
      Q3_AGGREGATOR_GROUP: "q3_aggregators_group"
      Q3_AGGREGATOR_AMOUNT: 2
      Q4_AGGREGATOR_GROUP: "q4_aggregators_group"
      Q4_AGGREGATOR_AMOUNT: 2
      WORD_COUNTER_GROUP: "word_counters_group"
      WORD_COUNTER_AMOUNT: 3
      Q5_JOINER_GROUP: "q5_joiner_group"
      PYTHONUNBUFFERED: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  q3_aggregator_0:
    build:
      context: ./src/
      dockerfile: q3_aggregator/Dockerfile
    container_name: q3_aggregator_0
    volumes:
      - q3_aggregator_0_data:/data
    environment:
      ID: "0"
      MOM_HOST: "rabbitmq"
      INPUT_GROUP: "q3_aggregators_group"
      RESULTS_GROUP: "results_group"
      GATEWAY_AMOUNT: 1
      PARSER_AMOUNT: 3
      WORD_SUM_AMOUNT: 3
      PYTHONUNBUFFERED: "1"
      STORAGE_PATH: "/data"
      BUCKET_AMOUNT: 32
      FLUSH_WORDS: 50000
      FLUSH_MESSAGES: 1000
    depends_on:
      rabbitmq:
        condition: service_healthy

  q3_aggregator_1:
    build:
      context: ./src/
      dockerfile: q3_aggregator/Dockerfile
    container_name: q3_aggregator_1
    volumes:
