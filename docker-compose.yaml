    container_name: client_1
    environment:
      <<: *client-env
      OUTPUT_FILE_Q1: "/output/client_1_output_q1.csv"
      OUTPUT_FILE_Q2: "/output/client_1_output_q2.csv"
      OUTPUT_FILE_Q3: "/output/client_1_output_q3.csv"
      OUTPUT_FILE_Q4: "/output/client_1_output_q4.csv"
